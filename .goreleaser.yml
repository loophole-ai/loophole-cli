version: 2
project_name: loophole

builds:
  - id: loophole
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/loophole-ai/loophole-cli/internal/version.Version={{.Version}}
    main: ./main.go
    binary: loophole

archives:
  - id: default
    ids:
      - loophole
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: binary
    ids:
      - loophole
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}darwin-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-{{ .Timestamp }}"

# Append to an existing release rather than replacing it, so a re-run never
# silently discards the notes and assets of a published version. Both `mode`
# and `make_latest` are options of release itself, not of its github block.
release:
  github:
    owner: loophole-ai
    name: loophole-cli
  mode: append
  make_latest: true

# Debian and RPM packages are not built for 1.0.0. nfpm only produces Linux
# packages, and the way to keep it away from the Windows and macOS builds is
# the `if` filter, which is a GoReleaser Pro feature. The setting is absent in
# the open source build, so it was rejected as an unknown field. Packaging can
# come back once the release works, either with Pro or by giving nfpm a build
# of its own that only targets Linux. Every platform is already covered by the
# archives and the bare binaries above.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^ci:"
      - "^ignore:"
      - "^example:"
      - "^wip:"