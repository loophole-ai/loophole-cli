version: 2
project_name: loophole

builds:
  - id: loophole
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/loophole-ai/loophole-cli/internal/version.Version={{.Version}}
    main: ./main.go
    binary: loophole

archives:
  - id: default
    builds:
      - loophole
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: binary
    builds:
      - loophole
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}darwin-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-{{ .Timestamp }}"

# Append to an existing release rather than replacing it, so a re-run never
# silently discards the notes and assets of a published version.
release:
  github:
    owner: loophole-ai
    name: loophole-cli
  mode: append
  make_latest: true

nfpms:
  # Linux only. nfpm has no way to build a deb or rpm for another platform,
  # and listing every build here stopped the release before any artifact was
  # produced.
  - ids:
      - loophole
    goos: linux
    maintainer: Garv Agnihotri <garvagnihotri22@gmail.com>
    description: Terminal-based AI assistant for software development
    homepage: "https://github.com/loophole-ai/loophole-cli"
    license: MIT
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}mac
      {{- else }}{{ .Os }}{{ end }}-{{ .Arch }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^ci:"
      - "^ignore:"
      - "^example:"
      - "^wip:"